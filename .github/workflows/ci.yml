name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # MASTER-02 native interop conformance relies on the pinned Ubuntu 24.04
    # hosted image rather than the moving ubuntu-latest alias.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.24.0

      - name: Install dependencies
        # A frozen install becomes mandatory once the real workspace lockfile is generated and committed.
        run: pnpm install --no-frozen-lockfile

      # Verify committed generated artifacts before any generator invocation.
      # CI is a verifier, not a repair step.
      - name: Verify portable artifact drift
        run: pnpm check:studio-interop

      - name: Verify native portable conformance
        run: pnpm check:studio-native

      - name: Install Studio browser
        run: pnpm --filter @vira-enterprise-genui/experience-studio-demo exec playwright install --with-deps chromium

      - name: Verify repository and browser gates
        run: pnpm verify:all

  ios-native:
    # Ubuntu validates generated Swift interoperability and the platform-neutral
    # Swift runtime tests. This job additionally forces the UIKit-gated sources
    # through a real Apple SDK compiler so `#if canImport(UIKit)` cannot hide
    # iOS-only build failures.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Report Xcode
        run: xcodebuild -version

      - name: Report Swift package schemes
        run: xcodebuild -list

      - name: Build native iOS package
        run: >-
          xcodebuild
          -scheme ViraNative
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
