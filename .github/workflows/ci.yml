name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_DB: vira_ci
          POSTGRES_PASSWORD: vira_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vira_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.24.0

      - name: Install PostgreSQL SQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production PostgreSQL
        env:
          VIRA_TEST_DATABASE_URL: postgresql://postgres:vira_ci@127.0.0.1:5432/vira_ci
          VIRA_POSTGRES_TOOLS_IMAGE: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        run: pnpm verify:production-db

      - name: Verify portable artifact drift
        run: pnpm check:studio-interop

      - name: Verify native portable conformance
        run: pnpm check:studio-native

      - name: Install Studio browser
        run: pnpm --filter @vira-enterprise-genui/experience-studio-demo exec playwright install --with-deps chromium

      - name: Verify repository and browser gates
        run: pnpm verify:all

  ios-native:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Report Xcode
        run: xcodebuild -version

      - name: Report Swift package schemes
        run: xcodebuild -list

      - name: Build native iOS package
        run: >-
          xcodebuild
          build
          -scheme ViraNative
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

  android-native:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.6.0'

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is required on the hosted runner}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools" >&2
            find "$ANDROID_HOME" -maxdepth 3 -type f -name sdkmanager -print >&2 || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build and test Android SDK
        run: >-
          gradle
          --no-daemon
          -p sdk/android
          :vira-android:assembleDebug
          :vira-android:testDebugUnitTest
