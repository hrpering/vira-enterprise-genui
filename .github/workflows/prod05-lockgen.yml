name: prod05-lockgen

on:
  pull_request:
    branches:
      - prod/05-dependency-join

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.event.pull_request.head.ref == 'tmp/prod05-lockgen'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.24.0

      - name: Generate exact workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit generated lockfile to helper branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "LOCKFILE_ALREADY_CURRENT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: generate PROD-05 lockfile"
          git push origin "HEAD:${HEAD_REF}"
